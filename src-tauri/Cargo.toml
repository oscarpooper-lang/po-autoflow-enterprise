[package]
name = "po-autoflow"
version = "1.2.7"
description = "PO AutoFlow Enterprise - Automated Purchase Order Processing System"
authors = ["Enterprise Automation Team"]
license = "Proprietary"
repository = "https://github.com/oscarpooper-lang/po-autoflow-enterprise"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
notify = "8.0"
rusqlite = { version = "0.34", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
walkdir = "2"
regex = "1"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
parking_lot = "0.12"
dirs = "6"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3"

