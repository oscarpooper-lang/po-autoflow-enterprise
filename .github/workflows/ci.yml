name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type check frontend
        run: npx tsc -b

      - name: Build frontend
        run: npm run build

      - name: Prepare stub resource directories for Cargo tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/ocr-worker", "src-tauri/resources/models" | Out-Null
          Set-Content -Path "src-tauri/resources/ocr-worker/.ci-placeholder" -Value "ci" -NoNewline
          Set-Content -Path "src-tauri/resources/models/.ci-placeholder" -Value "ci" -NoNewline

      - name: Run Rust unit & pipeline tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
