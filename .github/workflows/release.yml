name: Release Automation & Auto-Updater

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Lint & typecheck frontend
        run: |
          npm run lint
          npx tsc -b

      - name: Build frontend
        run: npm run build

      - name: Prepare stub resource directories for Cargo tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/ocr-worker", "src-tauri/resources/models" | Out-Null
          Set-Content -Path "src-tauri/resources/ocr-worker/.ci-placeholder" -Value "ci" -NoNewline
          Set-Content -Path "src-tauri/resources/models/.ci-placeholder" -Value "ci" -NoNewline

      - name: Run Rust test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check if release assets already exist
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) {
            Write-Output "skip_build=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Not a version tag push ($tag); quality checks completed."
            exit 0
          }
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $json = gh release view $tag --json assets 2>$null
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = $prevEap
          if ($exitCode -eq 0 -and $json) {
            $parsed = $json | ConvertFrom-Json
            $hasExe = $parsed.assets | Where-Object { $_.name -like "*-setup.exe" }
            $hasMsi = $parsed.assets | Where-Object { $_.name -like "*.msi" }
            if ($hasExe -and $hasMsi) {
              Write-Output "skip_build=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              Write-Host "Release $tag already published with installer assets; skipping duplicate build."
              exit 0
            }
          }
          Write-Output "skip_build=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build bundled standalone OCR worker (when CI builds release)
        if: steps.check.outputs.skip_build != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pymupdf onnxruntime opencv-python-headless numpy python-docx lxml rapidfuzz pyclipper
          .\scripts\build-ocr-worker.ps1

      - name: Build Windows Tauri Installers
        if: steps.check.outputs.skip_build != 'true'
        run: npm run tauri build

      - name: Publish Release Assets & latest.json
        if: steps.check.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $cleanVer = $tag.TrimStart('v', 'V')
          $assets = @()
          $nsisDir = "src-tauri\target\release\bundle\nsis"
          $msiDir = "src-tauri\target\release\bundle\msi"
          if (Test-Path $nsisDir) {
            $assets += Get-ChildItem -Path $nsisDir -Filter "*_x64-setup.exe" | Select-Object -ExpandProperty FullName
          }
          if (Test-Path $msiDir) {
            $assets += Get-ChildItem -Path $msiDir -Filter "*.msi" | Select-Object -ExpandProperty FullName
          }
          $setupExePath = $assets | Where-Object { $_ -like "*_x64-setup.exe" } | Select-Object -First 1
          $setupSize = if ($setupExePath -and (Test-Path $setupExePath)) { (Get-Item $setupExePath).Length } else { $null }
          $publishedName = "PO.AutoFlow.Enterprise_${cleanVer}_x64-setup.exe"
          $msiFilePath = $assets | Where-Object { $_ -like "*_x64_en-US.msi" } | Select-Object -First 1
          $msiSize = if ($msiFilePath -and (Test-Path $msiFilePath)) { (Get-Item $msiFilePath).Length } else { $null }
          $publishedMsiName = "PO.AutoFlow.Enterprise_${cleanVer}_x64_en-US.msi"
          $manifest = [ordered]@{
            tag_name = $tag
            release_name = "PO AutoFlow Enterprise $tag"
            release_notes = "Automated release $tag for Windows x64."
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            installer_name = $publishedName
            installer_url = "https://github.com/${{ github.repository }}/releases/download/$tag/$publishedName"
            installer_size_bytes = $setupSize
            msi_name = $publishedMsiName
            msi_url = "https://github.com/${{ github.repository }}/releases/download/$tag/$publishedMsiName"
            msi_size_bytes = $msiSize
          }
          $latestJsonPath = "src-tauri\target\release\bundle\latest.json"
          [System.IO.File]::WriteAllText((Join-Path $PWD $latestJsonPath), ($manifest | ConvertTo-Json -Depth 4), [System.Text.UTF8Encoding]::new($false))
          $assets += $latestJsonPath

          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevEap
          if ($exists) {
            & gh release upload $tag @assets --clobber
          } else {
            & gh release create $tag @assets --title "PO AutoFlow Enterprise $tag" --notes "Automated release $tag for Windows x64."
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release $tag." }
