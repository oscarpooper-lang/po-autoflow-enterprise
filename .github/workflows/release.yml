name: Release Automation & Auto-Updater

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Lint & typecheck frontend
        run: |
          npm run lint
          npx tsc -b

      - name: Run Rust test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: npm run build

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PO AutoFlow Enterprise ${{ github.ref_name }}'
          releaseBody: |
            ## PO AutoFlow Enterprise Release ${{ github.ref_name }}

            ### Automatic Updates
            Existing desktop installations detect and install this update via **Check Update** / **Download & Install Update** in the sidebar or Settings.

            ### Core Capabilities
            - Automated Purchase Order folder monitoring (`C:\PO-AutoFlow\Incoming`)
            - Neural PP-OCRv5 Thai & English extraction + AX 2012 GID font repair
            - Google Sheets supplier fuzzy matching & alias memory
            - Individual previewable email attachments or ZIP dispatch via Google Apps Script
            - Interactive Developer Terminal & System Tray background execution
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
